  - id: must-not-1
    criterion: 'MUST NOT: uses offset pagination or returns an unbounded list'
    pass: true
    reason: Paging works by filtering to ids greater than the cursor id and slicing to at most 100 items;
      there is no offset parameter and no unbounded list.
