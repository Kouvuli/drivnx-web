      is the ownership rule the answer cites.
  - id: must-4
    criterion: 'MUST: adds tests for pagination and ownership'
    pass: true
    reason: tests/test_api.py adds test_list_orders_with_coupons_paginates for paging and test_list_orders_with_coupons_only_own_orders_with_coupon,
