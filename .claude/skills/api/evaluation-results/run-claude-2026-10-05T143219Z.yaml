- id: cancel-endpoint
  pass: true
  checks:
  - id: must-1
    criterion: 'MUST: follows the existing route style in shop/routes.py (for example an action path like
      /api/orders/{id}/cancel)'
    pass: true
    reason: 'The agent added `("POST", "/api/orders/{id}/cancel"): api.cancel_order` to shop/routes.py,
      matching the existing `/api/orders/{id}/coupon` action-path style.'
  - id: must-2
    criterion: 'MUST: only lets the owner cancel the order and treats other users'' orders as not found,
      like add_coupon does'
    pass: true
    reason: '`cancel_order` raises `NotFound` when `order is None or order.customer_id != current_user["id"]`,
      the same check `add_coupon` uses.'
  - id: must-3
    criterion: 'MUST: defines what happens when the order cannot be cancelled in its current state (for
      example a conflict error)'
    pass: true
    reason: Orders that are neither open nor cancelled raise a new `Conflict` exception, documented as
      409, and are left unchanged; a repeat cancel returns the order unchanged.
  - id: must-4
    criterion: 'MUST: adds tests for success, not found or not owned, and invalid state'
    pass: true
    reason: CancelOrderTest covers success (test_owner_can_cancel_open_order), another customer's order
      and an unknown id (both NotFound), and invalid state (test_non_open_order_conflicts), and the agent
      reports all tests pass.
  - id: must-not-1
    criterion: 'MUST NOT: invents fields, statuses or business rules without marking them as assumptions
      or asking'
    pass: true
    reason: Under 'Decisions for you to confirm', the agent flags that only `open` exists in the code
      and that allowing only open orders to be cancelled is an assumption, along with the 409 mapping
      and the lack of refunds or stock changes; it does not separately flag the new `cancelled` status
      or the repeat-cancel behaviour, though both are explained.
  - id: must-not-2
    criterion: 'MUST NOT: returns success for an order the caller does not own'
    pass: true
    reason: The ownership check runs before any status logic, so another user's order always raises NotFound,
      and test_other_customer_gets_not_found confirms the status stays `open`.
